name: "NutriPrep — Generate Weekly Meal Plan"

on:
  schedule:
    # Every Sunday at 18:00 UTC = ~20:00 Luxembourg time (CEST)
    - cron: "0 18 * * 0"
  workflow_dispatch:
    inputs:
      force:
        description: "Force regeneration even if plan exists this week"
        type: choice
        options: ["false", "true"]
        default: "false"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # generate.py only needs the Anthropic SDK. Don't pull in pywebpush/pypdf
        # (notify.py / parse_plan.py deps) — a build failure there must not block
        # plan generation.
        run: pip install "anthropic>=0.40.0"

      - name: Generate meal plan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE_GENERATE: ${{ github.event.inputs.force || 'false' }}
        run: python nutrition/generate.py

      - name: Commit plan
        run: |
          git config user.name "Coach Léa"
          git config user.email "lea@nutriprep.local"
          # Stage whatever generate.py produced (don't fail on a missing file).
          git add -A nutrition/
          if git diff --staged --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Meal plan $(date +%Y-%m-%d)"
          # main moves often (the app commits push subs / coach history), so
          # rebase onto the latest and retry the push a few times to win races.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main || true
            if git push origin HEAD:main; then
              echo "Pushed on attempt $i."
              exit 0
            fi
            echo "Push attempt $i failed; retrying after sync…"
            sleep $((i * 3))
          done
          echo "::error::Could not push the generated plan after 5 attempts."
          exit 1

      - name: Commit diagnostics on failure
        if: failure()
        run: |
          if [ -f nutrition/_generation_error.txt ]; then
            git config user.name "Coach Léa"
            git config user.email "lea@nutriprep.local"
            git add nutrition/_generation_error.txt
            git commit -m "Generation error log $(date +%Y-%m-%dT%H:%M)" || true
            for i in 1 2 3; do
              git pull --rebase --autostash origin main || true
              git push origin HEAD:main && break
              sleep $((i * 3))
            done
          else
            echo "No diagnostic file was written (failure happened before generation)."
          fi
