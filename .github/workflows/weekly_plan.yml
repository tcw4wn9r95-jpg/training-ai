name: Weekly Training Plan

on:
  schedule:
    - cron: '0 19 * * 0'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate-plan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install garminconnect anthropic

      - name: Run sync
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python sync.py

      - name: Commit results
        run: |
          git config user.name "Training Bot"
          git config user.email "bot@training.com"
          git add workouts.json weekly_plan.md
          git diff --staged --quiet || git commit -m "Weekly plan $(date +%Y-%m-%d)"
          git push