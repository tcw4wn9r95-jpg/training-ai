name: Generate Weekly Plan
on:
  schedule:
    - cron: '0 15 * * 0'   # Sunday 15:00 UTC = 16:00 (4pm) Luxembourg
  workflow_dispatch: {}   # manual trigger — guard in sync.py always applies

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate plan (no Garmin push)
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python sync.py
      - name: Commit plan
        run: |
          git config user.name "Coach Claudio"
          git config user.email "bot@coachclaudio.local"
          git add workouts.json weekly_plan.md weekly_plan.json profile.json plan_status.json plan_history.json plan_block.json journey_start.json
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Draft plan $(date +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying..."
            sleep 3
          done
