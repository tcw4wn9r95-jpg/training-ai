name: Push to Garmin
on:
  workflow_dispatch:        # triggered by the "Let's do this!" button in the app

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install "garminconnect==0.3.3"
      - name: Push current plan to Garmin
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: python push.py
      - name: Commit push status
        run: |
          git config user.name "Coach Claudio"
          git config user.email "bot@coachclaudio.local"
          git add plan_status.json
          git diff --staged --quiet || git commit -m "Pushed to Garmin $(date +%Y-%m-%d)"
          git push
